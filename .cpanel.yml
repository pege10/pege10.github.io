---
# cPanel Git Version Control: a fal.mome.hu webgyökerébe csak az oldal fájljai kerülnek.
# A public_html/.htaccess (jelszavas védelem) nincs a repóban, ezért a másolás nem írja felül.
# cp -u: csak az újabb fájlokat másolja, így a nagy (változatlan) képek és a videó nem mennek át újra.
deployment:
  tasks:
    - export DEPLOYPATH=/home/falmome/public_html
    - /bin/mkdir -p $DEPLOYPATH/images/web $DEPLOYPATH/images/posters $DEPLOYPATH/images/cut $DEPLOYPATH/images/docs $DEPLOYPATH/video
    - /bin/cp -f index.html timeline.html styles.css app.js posters.js favicon.svg favicon-32.png apple-touch-icon.png $DEPLOYPATH/
    - /bin/cp -u images/fal.jpg images/fal_2500.jpg images/fal_5000.jpg images/fal_8000.jpg $DEPLOYPATH/images/
    - /bin/cp -Ru images/cut/. $DEPLOYPATH/images/cut/
    - /bin/cp -Ru images/docs/. $DEPLOYPATH/images/docs/
    - /bin/cp -Ru images/web/. $DEPLOYPATH/images/web/
    - /bin/cp -Ru images/posters/. $DEPLOYPATH/images/posters/
    - /bin/cp -u video/mome-fal-event.mp4 video/mome-fal-event.jpg $DEPLOYPATH/video/
